[package]
name = "openbot-one"
publish = false
version = "0.1.0"
description = "The desktop and mobile shell for OpenBot"
edition = "2021"
rust-version = "1.90"

[lib]
name = "openbot_one"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
cookie = "0.18"
bytes = "1"
sha2 = "0.10"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-clipboard-manager = "=2.5.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
keyring-core = "=1.0.1"
zeroize = { version = "1", features = ["derive"] }
getrandom = "=0.4.3"
base64 = "=0.23.1"
subtle = "=2.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
android-native-keyring-store = "=1.0.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
